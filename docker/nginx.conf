pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
      alias /tmp/menu-runtime-config.js;
      add_header Cache-Control "no-store" always;
    }

    # El Shell carga el remoto desde otro origen: import() de modulos exige CORS.
    # Son archivos estaticos publicos sin credenciales.
    location = /assets/remoteEntry.js {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache" always;
    }

    # El resto de /assets lleva hash en el nombre.
    location /assets/ {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
